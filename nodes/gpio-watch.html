<script type="text/javascript">
  RED.nodes.registerType('gpio-watch', {
    category: 'libgpiod',
    defaults: {
      name: { value: '' },
      device: { value: 'gpiochip0', required: true },
      pin: {
        value: '',
        required: true,
        validate(value) {
          return Number.isInteger(Number(value)) && Number(value) >= 0
        },
      },
      bias: { value: 'asis', required: true },
      edge: { value: 'both', required: true },
      debounce: {
        value: 0,
        required: true,
        validate(value) {
          return /^\d+$/.test(String(value))
        },
      },
    },
    color: '#FCF37A',
    icon: 'font-awesome/fa-eye',
    inputs: 0,
    outputs: 1,
    paletteLabel: 'GPIO watch',
    label() {
      return this.name || `gpio watch #${this.pin || '?'}`
    },
  })
</script>

<script type="text/x-red" data-template-name="gpio-watch">
  <div class="form-row" id="node-div-deviceRow">
    <label for="node-input-device"><i class="fa fa-circle"></i> Device</label>
    <input type="text" id="node-input-device" placeholder="gpiochip0">
  </div>
  <div class="form-row" id="node-div-pinRow">
    <label for="node-input-pin"><i class="fa fa-circle"></i> Pin</label>
    <input type="number" id="node-input-pin" placeholder="12" min="0" step="1">
  </div>
  <div class="form-row">
    <label for="node-input-bias"><i class="fa fa-filter"></i> Bias</label>
    <select id="node-input-bias" style="width: 200px;">
      <option value="asis">As-is</option>
      <option value="pullup">Pull-up</option>
      <option value="pulldown">Pull-down</option>
      <option value="floating">Floating</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-edge"><i class="fa fa-random"></i> Edge</label>
    <select id="node-input-edge" style="width: 200px;">
      <option value="both">Both</option>
      <option value="rising">Rising</option>
      <option value="falling">Falling</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-debounce"><i class="fa fa-clock-o"></i> Debounce (ms)</label>
    <input type="number" id="node-input-debounce" placeholder="0" min="0" step="1">
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-tips"><b>Note:</b> gpio-watch uses <code>gpiomon</code> for libgpiod event monitoring. Bias is applied by libgpiod, and debounce is handled in the node.</div>
</script>

<script type="text/x-red" data-help-name="gpio-watch">
  <p>gpio watch node. A source node that watches a GPIO line through libgpiod edge events and emits a message when the selected edge is detected.</p>
  <p>Each message includes <code>payload</code>, <code>edge</code>, <code>timestamp</code>, <code>timestampMs</code>, <code>pin</code>, <code>device</code>, <code>bias</code>, and <code>debounce</code>.</p>
  <p><code>payload</code> is inferred from the edge transition: rising emits <code>1</code> and falling emits <code>0</code>.</p>
</script>
